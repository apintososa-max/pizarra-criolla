<script>
/* Prepedido (primera visita): los datos del arranque se piden junto con los .js y no después de ellos; api.js los toma
   de window.__pre. Solo lo que no hay guardado (pc1:… en localStorage) y lo que de seguro se va a pedir:
   - siempre, la temporada en curso (core.js, decideSeason) y el día de hoy (core.js, pulse);
   - de madrugada (antes de las 5 en Caracas), también ayer (pulse, y la portada de Juegos);
   - en la portada de Juegos, la temporada anterior (juegos.js, navDates).
   Las rutas son las mismas de api.js, con SCHED_FIELDS idéntico: si cambian allá (o cambia quién pide qué), aquí también. */
(function () { try {
  var B = 'https://statsapi.mlb.com', P = window.__pre = {}, d = new Date(), s = d.getUTCMonth() >= 6 ? d.getUTCFullYear() : d.getUTCFullYear() - 1;
  var F = 'dates,date,games,gamePk,gameType,officialDate,gameDate,status,abstractGameState,detailedState,codedGameState,statusCode,reason,startTimeTBD,teams,away,home,team,id,name,score,isWinner,leagueRecord,wins,losses,linescore,currentInning,scheduledInnings,inningHalf,inningState,seriesDescription,seriesGameNumber,doubleHeader,gameNumber,venue,tiebreaker,description,resumeDate,resumedFrom,rescheduleDate,rescheduledFrom';
  var iso = function (t) { return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Caracas', year: 'numeric', month: '2-digit', day: '2-digit' }).format(t); };
  var sea = function (x) { return '/api/v1/schedule?sportId=17&leagueId=135&season=' + x + '&gameType=R,F,D,L,W&hydrate=linescore&fields=' + F; };
  var day = function (x) { return '/api/v1/schedule?sportId=17&leagueId=135&date=' + x + '&hydrate=linescore,probablePitcher,decisions'; };
  var pide = function (p) {
    try { if (localStorage.getItem('pc1:' + p)) return; } catch (e) { /* sin almacenamiento */ }
    var f = P[p] = fetch(B + p, { priority: 'low' });
    f.catch(function () { /* sin señal: api.js vuelve a pedirla */ });
  };
  pide(sea(s)); pide(day(iso(d)));
  if (+new Intl.DateTimeFormat('en-US', { timeZone: 'America/Caracas', hour: 'numeric', hourCycle: 'h23' }).format(d) < 5) pide(day(iso(new Date(d - 864e5))));
  if (/^(#\/?(juegos\/?)?)?$/.test(location.hash)) pide(sea(s - 1));
} catch (e) { /* navegador viejo: api.js pide todo como siempre */ } })();
</script>

<script>
/* Mientras bajan los .js: si la pantalla es una sección de la barra, su pestaña ya marcada; y un enlace abierto en frío
   a otra pantalla (un juego compartido, la tabla) no muestra la portada de Juegos sino un esqueleto neutro.
   core.js lo cambia por el esqueleto de la pantalla apenas arranca. */
(function () {
  var n = location.hash.replace(/^#\/?/, '').split('/')[0] || 'juegos';
  var a = document.querySelector('.tabs a[data-tab="' + n + '"]');
  if (a) { a.classList.add('on'); a.setAttribute('aria-current', 'page'); }
  if (n === 'juegos') return;
  var sk = function (w, h, r) { return '<span class="sk" style="width:' + w + ';height:' + h + (r ? ';border-radius:' + r : '') + '"></span>'; };
  var b = sk('100%', '7rem', 'var(--r-m)'), v = document.getElementById('view');
  if (v) v.innerHTML = '<div class="skel" role="status"><span class="sr">Cargando…</span><div class="skel-in" aria-hidden="true">' +
    sk('55%', '2rem') + b + b + b + '</div></div>';
})();
/* Si la app no arranca (core.js, o algo de lo que necesita, no bajó o falló: un corte a mitad de la descarga), el
   esqueleto no se queda para siempre: al terminar de leer los .js, o a los 20 s si alguno no termina de bajar, se dice
   en la pantalla, con "Reintentar". core.js marca PC.arranco apenas arranca, y desde ahí vigila él. Si los .js llegan
   después de este aviso, la app arranca igual y pinta encima. */
(function () {
  var t = 0;
  var aviso = function () {
    clearTimeout(t);
    var v = document.getElementById('view');
    if ((window.PC && window.PC.arranco) || !v || !v.firstElementChild || !/\bskel\b/.test(v.firstElementChild.className)) return;
    v.innerHTML = '<div class="empty err"><p class="empty-t">No se pudo abrir la app</p>' +
      '<p>Parte de la app no terminó de bajar. Revisa la conexión del teléfono y vuelve a intentar.</p>' +
      '<button type="button" class="btn" data-retry>Reintentar</button></div>';
    v.querySelector('[data-retry]').addEventListener('click', function () { location.reload(); });
  };
  t = setTimeout(aviso, 20000);
  // core.js arranca en DOMContentLoaded, después de este oyente: se mira en la vuelta siguiente
  document.addEventListener('DOMContentLoaded', function () { setTimeout(aviso, 0); });
})();
</script>
